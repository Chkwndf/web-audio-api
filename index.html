<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Voice Synthesis</title>
    <style> 
        body { background-color: rgb(0, 0, 0); }
        span, p, label { color: rgb(255, 255, 255); }
    </style>
    <script src="main.js" defer></script>
</head>
<body>
    <button id="button1">Play Waveform</button>
    <button id="button2">Play WOAH sound</button>

    <p>Frequency(Hz): <input id="freqInput" type="number"></p>
    <label for="waveformInput">파형을 선택하세요:</label>
    <select id="waveformInput">
        <option value="sine">사인파</option>
        <option value="square">사각파</option>
        <option value="sawtooth">톱니파</option>
        <option value="triangle">삼각파</option>
    </select>

<p id="result"></p>

</body>
</html>
